version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    # Opcjonalnie GPU (jeśli masz):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  # --- NOWOŚĆ: Kontener inicjalizujący ---
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      # Mówimy mu, żeby łączył się do głównego kontenera "ollama"
      - OLLAMA_HOST=ollama:11434
    # Skrypt: czekaj 5 sekund (żeby serwer wstał), a potem pobierz model
    entrypoint: /bin/sh
    command: -c "sleep 5; ollama pull llama3"
    restart: "no"

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
      - ./integrations:/app/integrations
    environment:
      - PIPELINES_API_KEY=0p3n-w3bu1
      - OPENAI_API_KEY=0p3n-w3bu1
      - PIPELINES_REQUIREMENTS_PATH=/app/pipelines/requirements.txt
      # Klucze Spotify dla wszystkich uzytkownikow (uwaga: widoczne w compose)
      - SPOTIFY_CLIENT_ID=0bd8f8cfded9489b9106a237eeaebada
      - SPOTIFY_CLIENT_SECRET=0879f57c23e84bcbb2defc86f014db2e
      - SPOTIFY_REDIRECT_URI=http://localhost:8888/callback
      # Jesli masz refresh_token, dodaj go tutaj aby odswiezac access token bez logowania
      # - SPOTIFY_REFRESH_TOKEN=your_refresh_token_here
      # opcjonalnie, jesli chcesz dostarczyc wstepny access token
      # - SPOTIFY_ACCESS_TOKEN=your_access_token_here
    restart: unless-stopped

  open-webui:
    # Używamy własnego Dockerfile z custom CSS
    build:
      context: ./customization
      dockerfile: Dockerfile
    image: open-webui-custom:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=0p3n-w3bu1
      # Customizacja UI przez zmienne środowiskowe
      - WEBUI_NAME=Asystent AI
      - DEFAULT_LOCALE=pl
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      - pipelines
    restart: unless-stopped