services:
  ollama:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    # Opcjonalnie GPU (jeśli masz):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  # --- NOWOŚĆ: Kontener inicjalizujący ---
  ollama-init:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      # Mówimy mu, żeby łączył się do głównego kontenera "ollama"
      - OLLAMA_HOST=ollama:11434
    # Skrypt: czekaj 5 sekund (żeby serwer wstał), a potem pobierz model
    entrypoint: /bin/sh
    command: -c "sleep 5; ollama pull llama3"
    restart: "no"

  pipelines:
    image: ghcr.io/open-webui/pipelines:main@sha256:b48e9bc338ce2be0acfbeff01810db72408a12f07739f9e3879c1f2b00952d6e
    container_name: pipelines
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
      - ./integrations:/app/integrations
    environment:
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:?Ustaw PIPELINES_API_KEY w pliku .env}
      - OPENAI_API_KEY=${PIPELINES_API_KEY:?Ustaw PIPELINES_API_KEY w pliku .env}
      - PIPELINES_REQUIREMENTS_PATH=/app/pipelines/requirements.txt
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_MODE=${MODEL_MODE:-auto}
      - ACTIVITY_DATA_FILE=/app/pipelines/activity_data.json
      # Dane dostępowe są pobierane z lokalnego pliku .env (nie commituj go).
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8888/callback}
      # Jesli masz refresh_token, dodaj go tutaj aby odswiezac access token bez logowania
      # - SPOTIFY_REFRESH_TOKEN=your_refresh_token_here
      # opcjonalnie, jesli chcesz dostarczyc wstepny access token
      # - SPOTIFY_ACCESS_TOKEN=your_access_token_here
    restart: unless-stopped

  open-webui:
    # Używamy własnego Dockerfile z custom CSS
    build:
      context: ./customization
      dockerfile: Dockerfile
    image: local/open-webui-custom:k8s
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=${PIPELINES_API_KEY:?Ustaw PIPELINES_API_KEY w pliku .env}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Ustaw WEBUI_SECRET_KEY w pliku .env}
      # Customizacja UI przez zmienne środowiskowe
      - WEBUI_NAME=Asystent AI
      - DEFAULT_LOCALE=pl
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
      - pipelines
    restart: unless-stopped
